name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Benchmark (synthetic gallery of 600)
        run: mvn -B -q test -Pbench

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t zk-fingerprint-match:ci .
      - name: Smoke test
        run: |
          mkdir -p /tmp/gallery
          docker run -d --name matcher -p 8080:8080 \
            -e MATCHER_TOKEN=ci-token-0123456789abcdef \
            -e GALLERY_SOURCE=directory -e GALLERY_DIR=/gallery \
            -v /tmp/gallery:/gallery:ro --read-only zk-fingerprint-match:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health && break; sleep 1; done
          curl -fsS http://localhost:8080/health | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/identify -d '{}')" = 401
          docker logs matcher
